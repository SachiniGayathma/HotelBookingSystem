openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Booking Management
  description: APIs for managing hotel bookings
paths:
  /api/bookings/{id}/cancel:
    put:
      tags:
      - Booking Management
      summary: Cancel a booking
      description: Cancel a confirmed booking and process refund
      operationId: cancelBooking
      parameters:
      - name: id
        in: path
        description: Booking ID
        required: true
        schema:
          type: string
      responses:
        "400":
          description: Cannot cancel booking
          content:
            '*/*':
              schema:
                type: object
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /api/bookings:
    post:
      tags:
      - Booking Management
      summary: Create a new booking
      description: "Create a booking, reserve room, and initiate payment"
      operationId: createBooking
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Booking"
        required: true
      responses:
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                type: object
        "200":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /api/bookings/quote:
    post:
      tags:
      - Booking Management
      summary: Get booking quote
      description: Calculate total price and payment amount for a booking request
      operationId: quoteBooking
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Booking"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/bookings/complete-after-payment:
    post:
      tags:
      - Booking Management
      summary: Complete booking after successful payment
      description: Reserves room and persists booking only after payment success
      operationId: completeAfterPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Booking"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/bookings/{id}:
    get:
      tags:
      - Booking Management
      summary: Get booking by ID
      description: Retrieve a specific booking
      operationId: getBooking
      parameters:
      - name: id
        in: path
        description: Booking ID
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Booking not found
          content:
            '*/*':
              schema:
                type: object
        "200":
          description: Booking found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /api/bookings/user/{userId}:
    get:
      tags:
      - Booking Management
      summary: Get bookings by user
      description: Retrieve all bookings for a user
      operationId: getBookingsByUser
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /api/bookings/test:
    get:
      tags:
      - Booking Management
      summary: Test endpoint
      description: Check if the booking service is running
      operationId: test
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/bookings/check-availability:
    get:
      tags:
      - Booking Management
      summary: Check room availability
      description: Check available rooms and prices for given dates and guests
      operationId: checkAvailability
      parameters:
      - name: hotelId
        in: query
        description: Hotel ID
        required: true
        schema:
          type: string
      - name: roomType
        in: query
        description: Room type
        required: true
        schema:
          type: string
      - name: checkIn
        in: query
        description: Check-in date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: checkOut
        in: query
        description: Check-out date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: guests
        in: query
        description: Number of guests
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "400":
          description: Invalid dates or parameters
          content:
            '*/*':
              schema:
                type: object
        "200":
          description: Availability data
          content:
            application/json: {}
  /api/bookings/all:
    get:
      tags:
      - Booking Management
      summary: Get all bookings
      description: Retrieve all bookings for analytics
      operationId: getAllBookings
      responses:
        "200":
          description: List of all bookings
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        hotelId:
          type: string
        roomId:
          type: string
        roomType:
          type: string
        mealPlan:
          type: string
        guests:
          type: integer
          format: int32
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        totalPrice:
          type: number
          format: double
        status:
          type: string
        paymentId:
          type: string
        createdAt:
          type: string
          format: date
        updatedAt:
          type: string
          format: date

