name: CTSE CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      # BUILD HOTEL SERVICE
      - name: Build Hotel Service
        working-directory: backend/hotel-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean install

      # BUILD BOOKING SERVICE
      - name: Build Booking Service
        working-directory: backend/booking-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean install

      # BUILD PAYMENT SERVICE
      - name: Build Payment Service
        working-directory: backend/payment-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean install

      # BUILD NOTIFY ANALYTICS SERVICE
      - name: Build Notify Analytics Service
        working-directory: backend/notify-analytics-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean install

      # SONARCLOUD SCAN (ONLY WHEN PR TARGET IS MAIN)
      - name: SonarCloud Scan
        if: github.base_ref == 'main'
        working-directory: backend/hotel-service
        run: |
          chmod +x ./mvnw
          ./mvnw sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # LOGIN TO DOCKER HUB
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # BUILD HOTEL SERVICE IMAGE
      - name: Build Hotel Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hotel-service ./backend/hotel-service

      # PUSH HOTEL SERVICE IMAGE
      - name: Push Hotel Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hotel-service

      # BUILD BOOKING SERVICE IMAGE
      - name: Build Booking Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/booking-service ./backend/booking-service

      # PUSH BOOKING SERVICE IMAGE
      - name: Push Booking Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/booking-service

      # BUILD PAYMENT SERVICE IMAGE (ONLY IF DOCKERFILE EXISTS)
      - name: Build Payment Service Image
        if: ${{ hashFiles('backend/payment-service/Dockerfile') != '' }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/payment-service ./backend/payment-service

      # PUSH PAYMENT SERVICE IMAGE (ONLY IF DOCKERFILE EXISTS)
      - name: Push Payment Service Image
        if: ${{ hashFiles('backend/payment-service/Dockerfile') != '' }}
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/payment-service

      # BUILD NOTIFY ANALYTICS SERVICE IMAGE
      - name: Build Notify Analytics Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notify-analytics-service ./backend/notify-analytics-service

      # PUSH NOTIFY ANALYTICS SERVICE IMAGE
      - name: Push Notify Analytics Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/notify-analytics-service
