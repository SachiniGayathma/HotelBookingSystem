name: CTSE CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build all backend services
        working-directory: backend
        run: |
          chmod +x hotel-service/mvnw
          ./hotel-service/mvnw -f pom.xml clean install

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        working-directory: backend
        run: |
          chmod +x hotel-service/mvnw
          ./hotel-service/mvnw -f pom.xml sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and Push Hotel Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/hotel-service:${{ github.sha }} ./backend/hotel-service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/hotel-service:${{ github.sha }}

      - name: Build and Push Booking Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/booking-service:${{ github.sha }} ./backend/booking-service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/booking-service:${{ github.sha }}

      - name: Build and Push Payment Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/payment-service:${{ github.sha }} ./backend/payment-service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/payment-service:${{ github.sha }}

      - name: Build and Push Notify Analytics Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/notify-analytics-service:${{ github.sha }} ./backend/notify-analytics-service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/notify-analytics-service:${{ github.sha }}

      - name: Azure Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          az extension add --name containerapp --upgrade

      - name: Check deploy values
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          echo "RG=${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "ENV=${{ secrets.AZURE_CONTAINERAPPS_ENV }}"
          echo "HOTEL_APP=${{ secrets.AZURE_HOTEL_APP_NAME }}"
          echo "BOOKING_APP=${{ secrets.AZURE_BOOKING_APP_NAME }}"
          echo "PAYMENT_APP=${{ secrets.AZURE_PAYMENT_APP_NAME }}"
          echo "NOTIFY_APP=${{ secrets.AZURE_NOTIFY_APP_NAME }}"
          echo "ACR=${{ secrets.ACR_LOGIN_SERVER }}"

      - name: Deploy Hotel Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if az containerapp show \
            --name "${{ secrets.AZURE_HOTEL_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            echo "Hotel app exists. Updating..."
            az containerapp update \
              --name "${{ secrets.AZURE_HOTEL_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/hotel-service:${{ github.sha }}"
          else
            echo "Hotel app does not exist. Creating..."
            az containerapp create \
              --name "${{ secrets.AZURE_HOTEL_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINERAPPS_ENV }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/hotel-service:${{ github.sha }}" \
              --ingress external \
              --target-port 8081 \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}"
          fi

      - name: Deploy Booking Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if az containerapp show \
            --name "${{ secrets.AZURE_BOOKING_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            echo "Booking app exists. Updating..."
            az containerapp update \
              --name "${{ secrets.AZURE_BOOKING_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/booking-service:${{ github.sha }}"
          else
            echo "Booking app does not exist. Creating..."
            az containerapp create \
              --name "${{ secrets.AZURE_BOOKING_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINERAPPS_ENV }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/booking-service:${{ github.sha }}" \
              --ingress external \
              --target-port 8080 \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}"
          fi

      - name: Deploy Payment Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if az containerapp show \
            --name "${{ secrets.AZURE_PAYMENT_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            echo "Payment app exists. Updating..."
            az containerapp update \
              --name "${{ secrets.AZURE_PAYMENT_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/payment-service:${{ github.sha }}"
          else
            echo "Payment app does not exist. Creating..."
            az containerapp create \
              --name "${{ secrets.AZURE_PAYMENT_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINERAPPS_ENV }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/payment-service:${{ github.sha }}" \
              --ingress external \
              --target-port 8082 \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}"
          fi

      - name: Deploy Notify Analytics Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if az containerapp show \
            --name "${{ secrets.AZURE_NOTIFY_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" > /dev/null 2>&1; then
            echo "Notify Analytics app exists. Updating..."
            az containerapp update \
              --name "${{ secrets.AZURE_NOTIFY_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/notify-analytics-service:${{ github.sha }}"
          else
            echo "Notify Analytics app does not exist. Creating..."
            az containerapp create \
              --name "${{ secrets.AZURE_NOTIFY_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINERAPPS_ENV }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/notify-analytics-service:${{ github.sha }}" \
              --ingress external \
              --target-port 8084 \
              --registry-server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}"
          fi