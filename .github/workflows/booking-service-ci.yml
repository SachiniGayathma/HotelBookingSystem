name: Booking Service CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'backend/booking-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      # BUILD BOOKING SERVICE
      - name: Build Booking Service
        working-directory: backend/booking-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean install

      # SONARCLOUD SCAN (ONLY WHEN PR TARGET IS MAIN)
      - name: SonarCloud Scan
        if: github.base_ref == 'main'
        working-directory: backend/booking-service
        run: |
          chmod +x ./mvnw
          ./mvnw sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # LOGIN TO DOCKER HUB
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # BUILD DOCKER IMAGE
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/booking-service ./backend/booking-service

      # PUSH IMAGE TO DOCKER HUB
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/booking-service